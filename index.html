<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sajib Ahmed</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f4efe6;
      color: #111;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(2.5rem, 8vw, 7rem);
    }

    .name {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(3.2rem, 10vw, 9.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #111;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .line {
      width: clamp(40px, 8vw, 90px);
      height: 3px;
      background: #ff4d00;
      margin: 2rem 0;
      opacity: 0;
      animation: expand 0.6s ease 0.5s forwards;
    }

    .message {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 500;
      color: #111;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.6s ease 0.7s forwards;
    }

    .sub {
      margin-top: 0.6rem;
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      font-weight: 400;
      color: rgba(17,17,17,0.45);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.6s ease 0.9s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes expand {
      from { width: 0; opacity: 0; }
      to   { width: clamp(40px, 8vw, 90px); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="name">Sajib Ahmed</div>
  <div class="line"></div>
  <div class="message">Portfolio coming soon.</div>
  <div class="sub">Something worth the wait is being built.</div>

</body>
</html>
